<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://doomsdaydevicev3.github.io/DoomsDayDeviceV3/WebAssets/IRP6.jpg">
    <meta name="twitter:image" content="https://doomsdaydevicev3.github.io/DoomsDayDeviceV3/WebAssets/IRP6.jpg">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IR Portfolio">
    <title>IRPortfolio</title>

    <link rel="stylesheet" href="{{ '/WebAssets/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/WebAssets/tags.css' | relative_url }}">
    
    <link rel="icon" href="{{ 'https://doomsdaydevicev3.github.io/DoomsDayDeviceV3/WebAssets/IRP5.png' | relative_url }}" sizes="64x64" type="image/png">
    <style>
    </style>

    <script>
    window.siteBaseUrl = "{{ '' | relative_url }}";
    </script>

    {% if jekyll.environment == "production" %}
    <script>
        // Gatekeeper: Only run GoatCounter if the domain matches exactly
        if (window.location.hostname !== "doomsdaydevicev3.github.io") {
            window.goatcounter = { no_onload: true };
        }
    </script>
    <script data-goatcounter="https://ily.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    {% endif %}
</head>

<body>
    <div class="warning-banner">« Notice: Site is temporarily underdergoing construction and may appear broken or
        incomplete. »
    </div>

    <header>
        <nav class="navbar">
            <div class="logo"><a href="{{ '/index.html' | relative_url }}">IRPortfolio</a></div>
            <div class="menu-toggle" id="mobile-menu">☰</div>
            <ul class="nav-links" id="nav-links">
                <li><a href="{{ '/index.html' | relative_url }}">Home</a></li>
                <li><a href="{{ '/skills.html' | relative_url }}">Skills</a></li>
                <li><a href="{{ '/projects.html' | relative_url }}">Projects</a></li>
                <li><a href="{{ '/contact.html' | relative_url }}">Contact</a></li>
            </ul>
        </nav>
        <div class="hr-frame-div">
            <hr class="hr-frame">
        </div>

    </header>

    <main>

        {{content}}

    </main>

    <div class="hr-frame-div-down">
        <hr class="hr-frame">
    </div>

    <footer id="footer">
        <p>© <span id="year"></span> I.R. | All rights reserved.</p>
        <p>
            <a href="https://github.com/DoomsDayDeviceV3">GitHub</a> |
            <a href="https://www.linkedin.com/in/ily-r/">LinkedIn</a> |
            <a href="mailto:ilyr@seas.upenn.edu">Email Me</a>
        </p>
    </footer>

    <script>
        // Auto-update the year in footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Mobile Menu Toggle
        const menuToggle = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>

</html>
