<script>
        // Visit Count
        const goatCounterUrl = 'https://ily.goatcounter.com/counter/TOTAL.json?no-events=t';

        fetch(goatCounterUrl)
            .then(response => {
            if (!response.ok) throw new Error('Network response was not ok');
            return response.json();
            })
            .then(data => {
                const exactCount = parseInt(data.count.replace(/[^0-9]/g, ''), 10);
            
                const roundedCount = exactCount - (exactCount % 10);
                
                document.getElementById('count').innerText = roundedCount.toLocaleString();
                })
            .catch(error => {
                console.error('Failed to fetch GoatCounter stats:', error);
                document.getElementById('count').innerText = 'Unavailable';
            });
</script>
